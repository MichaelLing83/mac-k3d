[package]
name = "mac-k3d"
version = "0.2.0"
edition = "2021"
description = "Prepare, start, configure, and tear down k3d + Docker Desktop on macOS (optional Jenkins)"
authors = ["MichaelLing83"]
license = "MIT"
repository = "https://github.com/MichaelLing83/mac-k3d"
readme = "README.md"
keywords = ["k3d", "kubernetes", "docker", "jenkins", "macos"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "mac-k3d"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
atty = "0.2"
dialoguer = "0.11"
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
